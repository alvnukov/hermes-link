[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "hermes-http-mcp"
dynamic = ["version"]
description = "Hermes Link — work with native Hermes agents, tasks and settings through MCP"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Hermes HTTP MCP contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
# Hermes 0.21.5 itself pins this SDK; upgrade after native compatibility testing.
dependencies = ["mcp==2.0.0", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "PyYAML>=6,<7", "pydantic>=2.11,<3"]

[project.urls]
Repository = "https://github.com/alvnukov/hermes-link"
Issues = "https://github.com/alvnukov/hermes-link/issues"

[dependency-groups]
dev = [
  "ruff==0.16.0", "mypy==2.3.0", "coverage[toml]==7.16.2", "pytest==9.1.1",
  "bandit==1.9.4", "pip-audit==2.10.1", "build==1.6.1", "types-PyYAML==6.0.12.20260906",
]
integration = ["ruamel.yaml>=0.18,<0.19", "python-dotenv>=1,<2", "croniter>=6,<7", "cron-descriptor>=1,<3", "psutil>=7,<8", "fastapi>=0.104,<1"]

[tool.hatch.build.targets.wheel]
packages = ["hermes_bridge"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "hermes_bridge/assets"

[tool.hatch.version]
path = "hermes_bridge/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["hermes_bridge", "scripts", "tests", "assets", "desktop", "__init__.py", "plugin.yaml", "config.example.json", "CHANGELOG.md", ".github", ".pre-commit-config.yaml", ".gitignore", "README.md", "LICENSE", "pyproject.toml", "uv.lock", "CONTRIBUTING.md", "SECURITY.md", "docs/settings.md", "docs/plugin-settings.md", "docs/quality.md", "docs/localization.md", "docs/profile-connection.md", "docs/compact-tools.md", "docs/smoke-remediation.md", "docs/regression-remediation.md", "docs/quickstart.md", "docs/troubleshooting.md"]

[tool.ruff]
required-version = "==0.16.0"
target-version = "py311"
line-length = 110
extend-exclude = [".quality-venv", "dist", "build"]

[tool.ruff.lint]
select = ["ALL"]
# Official formatter conflicts; Google docstrings choose D211/D212.
ignore = ["W191", "E111", "E114", "E117", "D203", "D206", "D213", "D300", "Q000", "Q001", "Q002", "Q003", "Q004", "COM812", "COM819"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8
max-positional-args = 8

[tool.ruff.lint.per-file-ignores]
# Test names express behavior; fixture tokens/SQL never represent credentials or user input.
"tests/**/*.py" = ["D", "S101", "S105", "S106", "S108", "S311", "S608", "PLR2004", "SLF001", "FBT001", "FBT002", "PT009", "PT027"]
# Runnable user-facing commands print their result.
"scripts/*.py" = ["T201"]
"hermes_bridge/main.py" = ["T201"]
"hermes_bridge/presentation.py" = ["T201"]
# Native Hermes directory plugins use a hyphenated directory name.
"__init__.py" = ["N999"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
files = ["hermes_bridge", "scripts", "tests"]
explicit_package_bases = true
exclude = [".quality-venv", "dist", "build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
# Explicit paths also cover the dynamically named directory loader, without
# interpreting __init__ as a module basename in the Python standard library.
source_dirs = ["."]
omit = ["tests/*", ".venv/*", ".quality-venv/*", "dist/*", "build/*"]
relative_files = true

[tool.coverage.report]
# __init__ is a native directory-plugin module; coverage also discovers its sibling
# test package. Report every production file, excluding test code from the denominator.
include = ["__init__.py", "hermes_bridge/*", "scripts/*"]
fail_under = 95
show_missing = true
skip_empty = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.bandit]
targets = ["hermes_bridge", "scripts"]
